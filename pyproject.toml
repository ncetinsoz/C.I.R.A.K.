[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirak"
version = "0.1.0"
description = "Ç.I.R.A.K. - Çok Amaçlı İnceleme, Raporlama ve Ağ Keşif Cihazı (El Terminali GUI & Ağ Teşhis Motoru)"
authors = [
    { name = "Nezih Çetinsöz" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "scapy>=2.5.0",
    "netifaces>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["cirak*"]

[project.scripts]
cirak = "cirak.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
